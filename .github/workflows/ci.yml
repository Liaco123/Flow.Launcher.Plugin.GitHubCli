name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore Flow.Launcher.Plugin.GitHubCli.sln --locked-mode
      - run: dotnet test Flow.Launcher.Plugin.GitHubCli.sln --configuration Release --no-restore
      - run: dotnet publish src/Flow.Launcher.Plugin.GitHubCli/Flow.Launcher.Plugin.GitHubCli.csproj --configuration Release --no-restore --output artifacts/plugin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Flow.Launcher.Plugin.GitHubCli
          path: artifacts/plugin
