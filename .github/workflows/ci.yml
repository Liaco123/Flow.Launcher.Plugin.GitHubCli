name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore Flow.Launcher.Plugin.GitHubCli.sln --locked-mode
      - run: dotnet test Flow.Launcher.Plugin.GitHubCli.sln --configuration Release --no-restore
      - run: dotnet publish src/Flow.Launcher.Plugin.GitHubCli/Flow.Launcher.Plugin.GitHubCli.csproj --configuration Release --no-restore --output artifacts/plugin
      - name: Verify local installer
        shell: pwsh
        run: ./scripts/test-install-local.ps1
      - name: Package and verify plugin ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'artifacts/plugin/*' -DestinationPath 'artifacts/Flow.Launcher.Plugin.GitHubCli.zip' -CompressionLevel Optimal
          ./scripts/test-package.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Flow.Launcher.Plugin.GitHubCli
          path: artifacts/plugin
