name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validate tag version
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $manifest = Get-Content 'src/Flow.Launcher.Plugin.GitHubCli/plugin.json' -Raw | ConvertFrom-Json
          $tagName = $env:TAG_NAME
          if ($tagName -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Tag $tagName must use the stable vMAJOR.MINOR.PATCH format."
          }
          $tagVersion = $Matches.version
          if ($manifest.Version -ne $tagVersion) {
            throw "Tag $tagVersion does not match plugin version $($manifest.Version)."
          }
      - run: dotnet restore Flow.Launcher.Plugin.GitHubCli.sln --locked-mode
      - run: dotnet test Flow.Launcher.Plugin.GitHubCli.sln --configuration Release --no-restore
      - run: dotnet publish src/Flow.Launcher.Plugin.GitHubCli/Flow.Launcher.Plugin.GitHubCli.csproj --configuration Release --no-restore --output artifacts/plugin
      - name: Package plugin
        shell: pwsh
        run: Compress-Archive -Path 'artifacts/plugin/*' -DestinationPath 'artifacts/Flow.Launcher.Plugin.GitHubCli.zip' -CompressionLevel Optimal
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: github.ref_type == 'tag'
        with:
          files: artifacts/Flow.Launcher.Plugin.GitHubCli.zip
          generate_release_notes: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref_type != 'tag'
        with:
          name: Flow.Launcher.Plugin.GitHubCli
          path: artifacts/Flow.Launcher.Plugin.GitHubCli.zip
